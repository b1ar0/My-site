<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иван Иванов | Специалист по веб-дизайну</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; max-width: 450px; width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .header-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 120px; }
        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 5px solid #fff; margin-top: -55px; object-fit: cover; background: #ccc; }
        .content { padding: 30px 20px; }
        h1 { font-size: 24px; color: #2d3748; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .bio { font-size: 16px; color: #4a5568; line-height: 1.6; margin-bottom: 25px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; transition: all 0.3s ease; }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-bg"></div>
        <!-- Замените URL картинки ниже на свое фото/логотип -->
        <img class="avatar" src="https://placeholder.com" alt="Фото">
        
        <div class="content">
            <h1>Иван Иванов</h1>
            <p class="subtitle">Веб-дизайнер & Разработчик</p>
            <p class="bio">Создаю удобные, современные и адаптивные сайты для бизнеса и личных брендов. Опыт работы более 5 лет.</p>
            
            <div class="links">
                <a href="https://t.me" class="btn btn-primary" target="_blank">Написать в Telegram</a>
                <a href="mailto:mail@example.com" class="btn btn-secondary">Электронная почта</a>
                <a href="https://github.com" class="btn btn-secondary" target="_blank">Портфолио проектов</a>
            </div>
        </div>
    </div>

</body>
</html>
